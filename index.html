<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schoolbooklets.com Games</title>
  <link rel="stylesheet" href="style.css">

  <!-- AdSense + Auto Ads -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3060028570702196"
       crossorigin="anonymous"></script>
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({
      google_ad_client: "ca-pub-3060028570702196",
      enable_page_level_ads: true
    });
  </script>
</head>
<body>

<header>
  <h1>🎮 schoolbooklets.com</h1>
  <p class="subtitle">Pick a game and start playing</p>
</header>

<main>
  <div class="games-grid" id="gamesGrid"></div>
</main>

<footer>
  <p>© 2026 schoolbooklets.com · All rights reserved</p>
</footer>

<script>
  const games = [
    "bottleflip", "cardrawing", "doom", "holeio", "mariocart",
    "minigolfmaster", "obbytower", "slope3", "snowballio",
    "sonicthehedchog", "supermario64", "supermariobros",
    "supermariorun", "tabs", "snowrider3d", "paper2", "pizzaify",
    "supermarioflash", "supermariosunshine", "supermarioworld"
  ];

  const gameNames = {
    "bottleflip": "Bottle Flip",
    "cardrawing": "Car Drawing",
    "doom": "Doom",
    "holeio": "Hole.io",
    "mariocart": "Mario Kart",
    "minigolfmaster": "Mini Golf Master",
    "obbytower": "Obby Tower",
    "slope3": "Slope 3",
    "snowballio": "Snowball.io",
    "sonicthehedchog": "Sonic the Hedgehog",
    "supermario64": "Super Mario 64",
    "supermariobros": "Super Mario Bros",
    "supermariorun": "Super Mario Run",
    "tabs": "TABS",
    "snowrider3d": "Snow Rider 3D",
    "paper2": "Paper 2",
    "pizzaify": "Pizzaify",
    "supermarioflash": "Super Mario Flash",
    "supermariosunshine": "Super Mario Sunshine",
    "supermarioworld": "Super Mario World"
  };

  const gamesGrid = document.getElementById('gamesGrid');
  games.forEach(game => {
    const a = document.createElement('a');
    a.classList.add('game');
    a.href = `games/${game}.html`;
    a.target = "_blank";

    const img = document.createElement('img');
    img.src = `images/${game}.png`;
    img.alt = gameNames[game];
    img.loading = "lazy";

    const label = document.createElement('span');
    label.classList.add('game-label');
    label.textContent = gameNames[game];

    a.appendChild(img);
    a.appendChild(label);
    gamesGrid.appendChild(a);
  });
</script>

</body>
</html>
